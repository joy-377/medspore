name: Regenerate article pages and sitemap
on:
  push:
    branches: [main]
    paths:
      - 'data/articles/**'
      - 'data/subjects/**'
      - 'data/config/**'
      - 'tools/build-content.mjs'
      - 'tools/page-shell.html'
      - 'js/features/article-view.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild pages and sitemap
        run: npm run build
      - name: Verify static data
        run: npm test
      - name: Commit generated pages when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- articles/ subjects/ share/ data/articles/index.json sitemap.xml index.html 404.html
          if ! git diff --cached --quiet; then
            git commit -m "Build article pages and refresh sitemap"
            git push
          fi
